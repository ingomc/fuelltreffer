services:
  fuelltreffer:
    build: .
    container_name: fuelltreffer
    expose:
      - "4000"

    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4000
      - TWOK_SOFTWARE_API_URL=${TWOK_SOFTWARE_API_URL:-https://backend4.2k-dart-software.com/2k-backend4/api/v1/frontend}
      # Umami Analytics
      - PUBLIC_UMAMI_URL=${PUBLIC_UMAMI_URL:-}
      - PUBLIC_UMAMI_WEBSITE_ID=${PUBLIC_UMAMI_WEBSITE_ID:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fuelltreffer.rule=Host(`${APP_DOMAIN:-darts.sc-oberfuellbach.de}`)"
      - "traefik.http.routers.fuelltreffer.entrypoints=websecure"
      - "traefik.http.routers.fuelltreffer.tls.certResolver=letsencrypt"
      - "traefik.http.routers.fuelltreffer.service=fuelltreffer"
      - "traefik.http.services.fuelltreffer.loadbalancer.server.port=4000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
